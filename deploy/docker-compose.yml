name: novel-reader

services:
  mysql:
    image: mysql:8.4
    container_name: novel-reader-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-novel_reader_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-novel_reader}
      MYSQL_USER: ${MYSQL_USER:-novel_reader}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-novel_reader_password}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: novel-reader-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: 0.0.0.0:8000
      SERVER_PORT: ${BACKEND_PORT:-8000}
      DATABASE_DSN: ${DATABASE_DSN:-novel_reader:novel_reader_password@tcp(mysql:3306)/novel_reader?charset=utf8mb4&parseTime=True&loc=Local}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-novel_reader}
      MYSQL_USER: ${MYSQL_USER:-novel_reader}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-novel_reader_password}
      UPLOAD_DIR: /app/data/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      COVER_DIR: /app/data/uploads/covers
      MAX_COVER_BYTES: ${MAX_COVER_BYTES:-10485760}
      AVATAR_DIR: /app/data/uploads/avatars
      MAX_AVATAR_BYTES: ${MAX_AVATAR_BYTES:-5242880}
      DEFAULT_COVER_FILE: ${DEFAULT_COVER_FILE:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-local-dev-only}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-admin}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-admin_password_change_me}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ../data/uploads:/app/data/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: novel-reader-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      HOST: 0.0.0.0
      PORT: 5173
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  mysql-data:
